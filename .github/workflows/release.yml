name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Verify tag matches package version
        # GITHUB_REF_NAME is the runner-provided tag name (e.g. v1.0.0);
        # it must equal v<__version__> so releases never drift from the code.
        run: |
          VERSION=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('viewdns/__init__.py').read()).group(1))")
          echo "Package version: $VERSION | Tag: $GITHUB_REF_NAME"
          test "v$VERSION" = "$GITHUB_REF_NAME"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  pypi-publish:
    name: Publish to PyPI (OIDC)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI via trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
