name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: black
        run: black --check .
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy .
      - name: bandit
        run: bandit -r viewdns
      - name: pip-audit
        run: pip-audit

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest
        # The suite runs against the live ViewDNS.info API (no mocks), so it
        # needs the VIEWDNS repository secret set in Settings > Secrets.
        env:
          VIEWDNS: ${{ secrets.VIEWDNS }}
        run: pytest
